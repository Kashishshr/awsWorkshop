version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: power-grid-postgres
    environment:
      POSTGRES_DB: power_grid_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: power-grid-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: power-grid-backend
    environment:
      NODE_ENV: development
      API_PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: power_grid_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: your-secret-key-change-in-production
      CORS_ORIGIN: http://localhost:4200
      LOG_LEVEL: debug
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src
      - ./backend/config:/app/config
    command: npm run dev

  # Frontend Application
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: power-grid-frontend
    ports:
      - "4200:4200"
    depends_on:
      - backend
    environment:
      API_URL: http://localhost:3000/api
      WS_URL: ws://localhost:3000
    volumes:
      - ./src:/app/src

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: power-grid-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: power-grid-network
