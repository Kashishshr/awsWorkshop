<div class="weather-map-container" data-testid="weather-map-container">
  <div class="map-header">
    <h2 class="map-title">Weather Map</h2>
    <div class="map-controls">
      <button (click)="onZoomIn()" class="control-btn" data-testid="weather-map-zoom-in-btn" title="Zoom in">
        +
      </button>
      <button (click)="onZoomOut()" class="control-btn" data-testid="weather-map-zoom-out-btn" title="Zoom out">
        −
      </button>
      <button (click)="onResetView()" class="control-btn" data-testid="weather-map-reset-view-btn" title="Reset view">
        ⊙
      </button>
    </div>
  </div>

  <div id="map-container" class="map" data-testid="weather-map-leaflet"></div>

  <div class="map-legend">
    <div class="legend-item">
      <span class="legend-icon weather-icon">🌡️</span>
      <span class="legend-label">Current Weather</span>
    </div>
    <div class="legend-item">
      <span class="legend-icon alert-icon critical">⚠️</span>
      <span class="legend-label">Critical Alert</span>
    </div>
    <div class="legend-item">
      <span class="legend-icon alert-icon high">⚠️</span>
      <span class="legend-label">High Alert</span>
    </div>
    <div class="legend-item">
      <span class="legend-icon alert-icon moderate">⚠️</span>
      <span class="legend-label">Moderate Alert</span>
    </div>
    <div class="legend-item">
      <span class="legend-icon alert-icon low">⚠️</span>
      <span class="legend-label">Low Alert</span>
    </div>
  </div>
</div>
